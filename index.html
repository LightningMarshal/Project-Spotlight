<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Uptrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="#/" class="brand-link">Uptrack</a>
      <span class="brand-tag">work impact log</span>
    </div>
    <nav class="nav">
      <a href="#/" data-route="landing">Today</a>
      <a href="#/weekly" data-route="weekly">Weekly</a>
      <a href="#/monthly" data-route="monthly">Monthly</a>
      <a href="#/annual" data-route="annual">Annual</a>
      <a href="#/stakeholder" data-route="stakeholder">Stakeholder</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Foundation -->
  <script src="js/taxonomies.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/entry.js"></script>
  <script src="js/export.js"></script>

  <!-- Views -->
  <script src="js/views/landing.js"></script>
  <script src="js/views/weekly.js"></script>
  <script src="js/views/monthly.js"></script>
  <script src="js/views/annual.js"></script>
  <script src="js/views/stakeholder.js"></script>
  <script src="js/views/settings.js"></script>

  <!-- Bootstrap -->
  <script src="js/app.js"></script>
</body>
</html>
