<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Defense-in-depth CSP. The load-bearing directive is `connect-src 'none'`:
       Uptrack never talks to the network at runtime, and this makes that
       guarantee enforceable by the browser. On file:// origins, `'self'` for
       scripts and styles may be lenient in Firefox and stricter in Chromium;
       if Chromium blocks local script/style loads, these two directives can
       be relaxed without weakening `connect-src`. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Uptrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="#/" class="brand-link">Uptrack</a>
      <span class="brand-tag">work impact log · v2.9.0</span>
    </div>
    <nav class="nav">
      <a href="#/" data-route="landing">Today</a>
      <a href="#/weekly" data-route="weekly">Weekly</a>
      <a href="#/monthly" data-route="monthly">Monthly</a>
      <a href="#/annual" data-route="annual">Annual</a>
      <a href="#/datareview" data-route="datareview">Data Review</a>
      <a href="#/followups" data-route="followups">Follow-Ups</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Foundation -->
  <script src="js/taxonomies.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/entry.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/export.js"></script>

  <!-- Views -->
  <script src="js/views/landing.js"></script>
  <script src="js/views/weekly.js"></script>
  <script src="js/views/monthly.js"></script>
  <script src="js/views/annual.js"></script>
  <script src="js/views/stakeholder.js"></script>
  <script src="js/views/datareview.js"></script>
  <script src="js/views/followups.js"></script>
  <script src="js/views/settings.js"></script>

  <!-- Bootstrap -->
  <script src="js/app.js"></script>
</body>
</html>
